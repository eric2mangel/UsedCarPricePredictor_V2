[build-system]
requires = ["setuptools>=82.0"]
build-backend = "setuptools.build_meta"

[project]
name = "automotive-price-prediction"
version = "1.0.0"
description = "Pipeline de prédiction du prix des véhicules d'occasion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb==1.4.4",
    "joblib==1.5.3",
    "lightgbm==4.7.0",
    "matplotlib==3.10.8",
    "matplotlib-inline==0.2.1",
    "numpy==2.4.2",
    "openpyxl==3.1.5",
    "pandas==3.0.1",
    "pillow==12.1.1",
    "plotly==6.6.0",
    "polars==1.38.1",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "shap==0.52.0",
    "xgboost==3.4.1"
]

[project.optional-dependencies]
dev = [
    "jupyter>=1.1.1",
    "ipykernel>=7.2.0",
]